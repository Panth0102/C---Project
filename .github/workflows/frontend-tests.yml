name: Frontend Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint with ESLint (if configured)
        run: |
          cd frontend
          npm run lint --if-present || true

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Run tests
        run: |
          cd frontend
          npm run test 2>&1 | tee test-output.log

      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:coverage 2>&1 || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build-node-${{ matrix.node-version }}
          path: frontend/dist/

      - name: Archive test output
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: frontend-test-output-node-${{ matrix.node-version }}
          path: frontend/test-output.log

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let testOutput = '';
            try {
              testOutput = fs.readFileSync('frontend/test-output.log', 'utf8').slice(-500);
            } catch (e) {
              testOutput = 'Could not read test output';
            }
            
            const message = `✅ Frontend tests & build successful
            
            **Tested on:** Node.js 18.x, 20.x
            **Build output:** See artifacts
            **Coverage:** See Codecov report
            
            \`\`\`
            ${testOutput}
            \`\`\`
            
            Run \`cd frontend && npm test\` to verify locally.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
