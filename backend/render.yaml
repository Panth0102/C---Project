services:
  - type: web
    name: fullstack-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard — never commit real DB URLs
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel deployment URL
      - key: ALLOWED_ORIGINS
        sync: false          # Comma-separated, e.g. https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: "3.12.0"
